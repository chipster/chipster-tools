name: Format

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# The check only reads the repository.
permissions:
  contents: read

# A new push to a pull request makes an in-progress run redundant. Runs on
# master are not cancelled, so that every commit on master keeps a result
# even when merges land in quick succession.
concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  air:
    runs-on: ubuntu-latest
    # The check takes seconds; this only bounds a hung download.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The Air version is pinned here, because a new release can format
      # differently. To upgrade, change it and reformat with the new version
      # in the same pull request.
      - uses: posit-dev/setup-air@v1
        with:
          version: "0.12.0"

      # Formatting settings are in air.toml.
      - run: air format --check .

  ruff:
    runs-on: ubuntu-latest
    # The check takes seconds; this only bounds a hung download.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Pinned like Air above. Formatting settings are in ruff.toml.
      - uses: astral-sh/ruff-action@v4
        with:
          version: "0.17.2"
          args: format --check
